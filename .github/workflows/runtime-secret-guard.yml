name: Guard against committed runtime secrets

on:
  pull_request:
    paths:
      - 'config/**'
      - '.gitignore'
      - '.github/workflows/runtime-secret-guard.yml'
  push:
    branches: [main]
    paths:
      - 'config/**'
      - '.gitignore'
      - '.github/workflows/runtime-secret-guard.yml'

permissions:
  contents: read

jobs:
  no-runtime-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config
            .gitignore
          sparse-checkout-cone-mode: true
      - name: Ensure sensitive runtime paths are not tracked
        shell: bash
        run: |
          set -euo pipefail
          found=$(git ls-files -- 'config/config_db.php' 'config/config_db.php.*' 'config/glpicrypt.key' 'config/*.key' 'config/*.pem' 'config/*.p12' 'config/*.pfx' 'config/*.swp' 'config/*.swo' 'config/.*.swp' 'config/.*.swo')
          if [[ -n "$found" ]]; then
            echo "::error::Runtime configuration or private key is tracked. Remove it from the index and rotate exposed secrets."
            exit 1
          fi
          echo "No known runtime config/key paths are tracked at this commit."
